services:
  - type: web
    name: mw-craft
    runtime: node
    plan: starter
    region: singapore
    autoDeployTrigger: commit
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20.15.1
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/game.db
      - key: MW_ENABLE_AI_TRAINING
        value: "0"
      - key: MW_ENABLE_AI_TRAINING_UI
        value: "0"
      - key: MW_ALLOW_AI_DIFFICULTY_SELECTION
        value: "0"
      - key: MW_ALLOW_RL_WEIGHT_LOADING
        value: "0"
      - key: MW_PRELOAD_RL_ON_START
        value: "0"
      - key: MW_ALLOW_RL_WEIGHT_UPDATES
        value: "0"
    disk:
      name: mw-craft-data
      mountPath: /var/data
      sizeGB: 1
